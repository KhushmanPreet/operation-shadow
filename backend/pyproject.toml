[project]
name = "operation-shadow-backend"
version = "0.1.0"
description = "Operation Shadow FastAPI service layer, SQLite persistence, WebSocket gateways, and ULTRON AI engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.7,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["fastapi", "."]

[tool.mypy]
python_version = "3.13"
mypy_path = "fastapi:."
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ultron",
    "ultron.*",
    "tests.test_system_architecture",
    "tests.test_ultron_main",
    "tests.test_ultron_planner",
    "tests.test_ultron_replanning",
    "tests.test_ultron_safety",
]
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
